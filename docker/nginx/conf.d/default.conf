# ==========================================
# Shopi NGINX Reverse Proxy & Load Balancer
# ==========================================

# Docker Embedded DNS resolver with short TTL (5s) for dynamic service discovery and round-robin load balancing
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for container orchestrator / Docker Compose
    location /health {
        access_log off;
        return 200 "OK\n";
    }

    # API Gateway routing with dynamic load balancing across scaled instances
    # Using variable proxy_pass forces NGINX to re-resolve DNS against 127.0.0.11
    location /api/ {
        set $api_gateway_backend "http://api-gateway:8080";
        proxy_pass $api_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Next.js Frontend routing with dynamic resolution
    location / {
        set $frontend_backend "http://nextjs-frontend:3000";
        proxy_pass $frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
