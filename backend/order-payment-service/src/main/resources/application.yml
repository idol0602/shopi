server:
  port: 8082

spring:
  application:
    name: order-payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shopi_order_db}
    username: ${SPRING_DATASOURCE_USERNAME:shopi_order_user}
    password: ${SPRING_DATASOURCE_PASSWORD:order_secret_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

grpc:
  server:
    port: 9092
  client:
    shop-catalog-service:
      address: ${GRPC_CLIENT_SHOP_CATALOG_SERVICE_ADDRESS:static://shop-catalog-service:9091}
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.shopi.order: DEBUG
    net.devh.boot.grpc: INFO
