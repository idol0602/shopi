server:
  port: 8083

grpc:
  server:
    port: 9093

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/shopi_identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:shopi_identity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:identity_secret_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

shopi:
  jwt:
    secret: ${JWT_SECRET:ShopiSuperSecureEnterpriseKey2026MustBeAtLeast256BitsLong}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
